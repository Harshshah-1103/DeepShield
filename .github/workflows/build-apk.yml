name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package DeepShield APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Keystore, Wrapper & Environment
        run: |
          # 1. Ensure .env exists so secrets plugin does not fail
          touch .env
          if [ -f .env.example ]; then
            cp .env.example .env
          fi

          # 2. Restore or generate debug.keystore
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > debug.keystore 2>/dev/null || true
            fi
            if [ ! -f debug.keystore ]; then
              echo "Generating debug.keystore with keytool..."
              keytool -genkey -v -keystore debug.keystore -storepass android \
                -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
                -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

          # 3. Ensure gradlew is executable
          chmod +x gradlew

          # 4. Fallback if wrapper jar is missing
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            mkdir -p gradle/wrapper
            curl -sSL -o gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/master/gradle/wrapper/gradle-wrapper.jar || true
          fi

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate Generated APK
        id: find_apk
        run: |
          APK_FILE=$(find app/build/outputs/apk -type f -name "*debug.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          fi
          echo "Found APK: $APK_FILE"
          echo "apk_path=$APK_FILE" >> $GITHUB_OUTPUT

      - name: Upload APK as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeepShield-AI-debug-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30
